name: Deploy Blog

# 手动触发（画廊图片只在本机，云端 clone 不到 source/carousel/，
# 自动构建会得到空画廊并覆盖线上，所以改为手动，平时用本地 npm run deploy）
on:
  workflow_dispatch:

permissions:
  contents: write   # 允许写入 gh-pages 分支
  pages: write      # 允许操作 GitHub Pages
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages